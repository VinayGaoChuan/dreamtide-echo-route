# 每次推送到 main、每个 PR 都跑一遍：语法检查 → 三关无头通关模拟 → 联机同步测试 → 打包单文件。
# 任何一步失败，这次提交旁边会出现红叉；GitHub Pages 仍按 main 自动部署，所以推送前最好先在本地跑同样的命令。
name: 检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 语法检查
        run: for f in js/*.js tools/*.js; do node --check "$f" || exit 1; done
      - name: 三关无头通关模拟
        run: node tools/smoke-sim.js js
      - name: 家园规则（第一小时因果链 + 存档安全）
        run: node tools/home-sim.js
      - name: 联机同步（2 人三关逐帧比对）
        run: node tools/mp-sim.js js all 2 direct
      - name: 联机网络（3 人、20% 丢包、中途掉线）
        run: node tools/mp-sim.js js 1-2 3 net 0.2 100 5 2@3000
      - name: 联机断网（v0.11 §8：断网 30 秒先判断线中、回来追帧恢复；房主断网同样；超过 60 秒才移除）
        run: |
          NETSEED=3 node tools/mp-sim.js js 1-2 3 net 0.1 100 5 '1@2000~900'
          NETSEED=5 node tools/mp-sim.js js 1-2 3 net 0.1 100 5 '0@2000~900'
          NETSEED=7 node tools/mp-sim.js js vs 2 net 0.1 100 5 '1@3000~600'
      - name: 联机升级限时（1 号一直不选：到时自动选推荐，整局不被拖住）
        run: |
          NOCHOOSE=1 node tools/mp-sim.js js 1-1 2 direct
      - name: 联机对抗（2 人打满三段、3 人网络丢包，逐帧比对分数和结局）
        run: |
          node tools/mp-sim.js js vs 2 direct
          node tools/mp-sim.js js vs 3 net 0.1 100 5
      - name: 联机中转服务器
        run: node tools/relay-test.js
      - name: 真联机（本地中转服务器 + 无头客户端，真实 WebSocket：2 人打 60 秒；3 人房主第 25 秒断线，其余人继续；第 25 秒刷新页面回到原对局）
        run: |
          PORT=8091 node server/relay.js &
          sleep 1
          node tools/net-bot.js ws://localhost:8091/mp 2 1-1 60
          node tools/net-bot.js ws://localhost:8091/mp 3 1-1 70 --host-leave=25
          node tools/net-bot.js ws://localhost:8091/mp 2 1-1 70 --reload=1@25
          node tools/net-bot.js ws://localhost:8091/mp 2 1-1 90 --dark=1@10~20 --reload=1@50
          node tools/net-bot.js ws://localhost:8091/mp 2 1-1 90 --reload=1@30 --lat=150 --spikes=1
      - name: 打包单文件
        run: python3 build.py dist/dreamtide.html
