<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>余烬：迷航</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体不挡页面：先用系统字体显示，谷歌字体能加载就换上（国内打不开谷歌时不会白屏） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+SC:wght@500;700;900&family=ZCOOL+KuaiLe&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  color-scheme:dark;
  --deep:#0f0c2a; --ink:#2d2358;
  --paper:#fff6ee; --lamp:#ffc94a; --lamp2:#ffe596; --coral:#ff7a6b; --cyan:#5fd4ff;
  --dust:#b58cff; --info:#a9c8ff; --pink:#ff7eb6; --mint:#6fe39a;
  --text:#f4efff; --dim:#bcb3e6; --mute:#8b83bb;
  --edge:rgba(182,200,255,.24);
  --f-display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
  --u:1; --tb:1;
  --fs-xs:max(11px,calc(13px*var(--u)));
  --fs-s:max(12px,calc(15px*var(--u)));
  --fs-m:max(13px,calc(18px*var(--u)));
  --fs-l:max(16px,calc(25px*var(--u)));
  --fs-xl:max(22px,calc(40px*var(--u)));
  --r:calc(20px*var(--u));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--deep);overflow:hidden}
body{color:var(--text);font-family:var(--f-body);font-weight:500;-webkit-font-smoothing:antialiased;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* 阿拉伯语：版面不翻转（横版飞行向右），每段文字按自己的内容定方向，标点和数字落在正确的一侧 */
html[lang=ar] body,html[lang=ar] body *{unicode-bidi:plaintext}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#231c5c 0%,#140f36 60%,#0c0a24 100%)}
#cv{position:absolute;display:block}
#stage{position:absolute;overflow:hidden;pointer-events:none}
#screens{position:absolute;inset:0;pointer-events:none;z-index:3}
#screens > .screen{pointer-events:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
:focus{outline:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:14px}
svg.ic{width:1.1em;height:1.1em;fill:currentColor;flex:none;vertical-align:-.16em}
.flip{transform:scaleX(-1)}

/* ---------- building blocks ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:auto;padding-block:calc(20px*var(--u));padding-inline:max(16px,calc(32px*var(--u)));animation:scrIn .26s ease-out both}
.screen.dim{background:radial-gradient(90% 80% at 50% 45%,rgba(20,15,56,.6),rgba(10,8,30,.88))}
.screen.dim-soft{background:linear-gradient(180deg,rgba(12,9,34,.4),rgba(12,9,34,.7))}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{position:relative;background:linear-gradient(180deg,rgba(44,36,108,.9),rgba(24,19,64,.92));border:2px solid var(--edge);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 calc(14px*var(--u)) calc(40px*var(--u)) rgba(6,4,24,.55)}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.5;background-image:var(--paper-tex,none);background-size:calc(256px*var(--u));mix-blend-mode:soft-light}
.h-display{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-weight:800;font-variant-numeric:tabular-nums}
.dim-text{color:var(--dim)}
.row{display:flex;align-items:center;gap:calc(10px*var(--u))}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:max(40px,calc(52px*var(--u)));padding:0 max(14px,calc(24px*var(--u)));border-radius:999px;font-family:var(--f-display);font-size:var(--fs-m);color:var(--text);background:rgba(255,255,255,.07);border:2px solid rgba(190,205,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:transform .12s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.13);box-shadow:0 0 18px rgba(150,170,255,.25)}
.btn:active{transform:scale(.96)}
.btn.primary{color:#3b2152;border-color:#fff3c6;background:linear-gradient(180deg,#fff0b0 0%,#ffcf55 52%,#f3a43b 100%);box-shadow:0 0 calc(26px*var(--u)) rgba(255,201,74,.5),inset 0 -4px 0 rgba(170,90,20,.35),inset 0 3px 0 rgba(255,255,255,.65)}
.btn.primary:hover{box-shadow:0 0 calc(40px*var(--u)) rgba(255,201,74,.75),inset 0 -4px 0 rgba(170,90,20,.35),inset 0 3px 0 rgba(255,255,255,.65)}
.btn.big{min-height:max(52px,calc(74px*var(--u)));font-size:var(--fs-l);padding:0 max(28px,calc(56px*var(--u)))}
.btn.cyan{border-color:rgba(95,212,255,.6);box-shadow:0 0 16px rgba(95,212,255,.25)}
.btn.pink{border-color:rgba(255,126,182,.6);box-shadow:0 0 16px rgba(255,126,182,.25)}
.btn.coral{border-color:rgba(255,122,107,.6)}
.btn.small{min-height:max(32px,calc(40px*var(--u)));font-size:var(--fs-s);padding:0 max(10px,calc(16px*var(--u)))}
.btn[disabled]{opacity:.45;filter:saturate(.5)}
.btn[aria-disabled="true"],.job[aria-disabled="true"],.icon-btn[aria-disabled="true"]{opacity:.45;filter:saturate(.5);cursor:not-allowed}
.pulse{animation:pulseTap .5s ease-out}
@keyframes pulseTap{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,215,106,.7)}35%{transform:scale(1.04);box-shadow:0 0 0 8px rgba(255,215,106,.25)}100%{transform:scale(1);box-shadow:0 0 0 14px rgba(255,215,106,0)}}
.icon-btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:max(56px,calc(78px*var(--u)));padding:0 calc(6px*var(--u));white-space:nowrap;min-height:max(56px,calc(78px*var(--u)));border-radius:calc(22px*var(--u));background:rgba(30,24,80,.72);border:2px solid var(--edge);font-size:var(--fs-xs);color:var(--dim);transition:transform .12s,border-color .2s,color .2s;position:relative}
.icon-btn svg{width:max(22px,calc(30px*var(--u)));height:max(22px,calc(30px*var(--u)));fill:var(--info)}
.icon-btn:hover{border-color:rgba(255,201,74,.6);color:var(--text)}
.icon-btn:hover svg{fill:var(--lamp)}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 8px var(--coral)}
.chip{display:inline-flex;align-items:center;gap:.35em;padding:.18em .7em;border-radius:999px;font-size:var(--fs-xs);background:rgba(169,200,255,.12);border:1px solid rgba(169,200,255,.3);color:var(--info);white-space:nowrap}
.chip.gold{background:rgba(255,201,74,.14);border-color:rgba(255,201,74,.45);color:var(--lamp2)}
.chip.coral{background:rgba(255,122,107,.14);border-color:rgba(255,122,107,.45);color:#ffb2a8}
.chip.cyan{background:rgba(95,212,255,.13);border-color:rgba(95,212,255,.45);color:#aeeaff}
.chip.dust{background:rgba(181,140,255,.15);border-color:rgba(181,140,255,.45);color:#dcc8ff}
.chip.pink{background:rgba(255,159,207,.14);border-color:rgba(255,159,207,.5);color:#ffc4e2}
.chip.mint{background:rgba(111,227,154,.14);border-color:rgba(111,227,154,.45);color:#b8f5cf}
.chip.r-N{color:#dfe6ff;border-color:rgba(223,230,255,.5)}.chip.r-R{color:#9fe3ff;border-color:rgba(127,216,255,.6)}.chip.r-SR{color:#dcc2ff;border-color:rgba(201,160,255,.7)}.chip.r-SSR{color:#ffe38a;border-color:rgba(255,215,106,.8);background:rgba(255,215,106,.16)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.6em;padding:0 .35em;border-radius:.4em;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-bottom-width:3px;font-family:var(--f-num);font-weight:800;font-size:.85em;color:var(--text)}
.label{font-size:var(--fs-xs);letter-spacing:.12em;color:var(--mute)}
.back-btn{position:absolute;top:calc(16px*var(--u));left:max(16px,calc(28px*var(--u)));z-index:3}
.screen-title{display:flex;align-items:baseline;flex-wrap:wrap;gap:calc(6px*var(--u)) calc(14px*var(--u));margin:0 0 calc(12px*var(--u));padding-left:max(104px,calc(120px*var(--u)))}
.screen-title h2{font-family:var(--f-display);font-weight:400;font-size:var(--fs-xl);margin:0;color:var(--paper);text-shadow:0 0 18px rgba(255,201,74,.35)}
.screen-title p{margin:0;color:var(--dim);font-size:var(--fs-s)}
.cur-row{display:flex;gap:calc(8px*var(--u));flex-wrap:wrap}
.cur{display:inline-flex;align-items:center;gap:.4em;padding:.25em .8em;border-radius:999px;background:rgba(20,16,54,.72);border:1px solid var(--edge);font-size:var(--fs-s)}
.cur svg{width:1.2em;height:1.2em}
.cur .num{font-size:var(--fs-m)}
.stars{color:var(--lamp);letter-spacing:.05em;font-size:var(--fs-s)}
.stars i{font-style:normal;color:rgba(255,255,255,.2)}

/* ---------- title ---------- */
#scr-title{cursor:pointer;justify-content:center;align-items:flex-end;text-align:center;padding-inline:max(16px,calc(90px*var(--u)))}
.title-block{display:flex;flex-direction:column;align-items:center;gap:calc(10px*var(--u));max-width:min(92%,calc(640px*var(--u)))}
.title-main{font-family:var(--f-display);font-weight:400;font-size:max(56px,calc(150px*var(--u)));line-height:.95;color:var(--paper);margin:0;text-shadow:0 0 calc(30px*var(--u)) rgba(255,201,74,.55),0 calc(6px*var(--u)) 0 #3a2c72}
.title-main em{font-style:normal;color:var(--lamp2)}
#set-lang{font:inherit;font-size:var(--fs-s);background:rgba(8,6,18,.75);color:var(--paper);border:1px solid var(--edge);border-radius:10px;padding:.3em .7em;max-width:60%}
.title-main.long{font-size:max(46px,calc(112px*var(--u)));letter-spacing:.02em}.title-main.long em{display:block}
.demo-end{gap:calc(18px*var(--u))}.demo-maps{display:flex;gap:calc(14px*var(--u))}.demo-map{display:flex;flex-direction:column;align-items:center;justify-content:center;width:calc(120px*var(--u));height:calc(120px*var(--u));border-radius:16px;border:2px solid var(--mc);background:rgba(8,6,18,.7);color:var(--mc);font-family:var(--f-display);font-size:var(--fs-l)}.demo-map span{font-size:var(--fs-s);opacity:.7}
.title-sub{font-family:var(--f-display);font-size:max(20px,calc(44px*var(--u)));color:#d9ccff;letter-spacing:.3em;margin:0 0 0 .3em;text-shadow:0 0 16px rgba(181,140,255,.6)}
.title-tag{font-size:var(--fs-m);color:var(--paper);background:rgba(30,24,80,.55);border:1px solid var(--edge);padding:.45em 1.1em;border-radius:999px;margin-top:calc(12px*var(--u))}
.title-start{margin-top:calc(22px*var(--u));font-family:var(--f-display);font-size:var(--fs-l);color:var(--lamp2);animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.98)}50%{opacity:1;transform:scale(1.03)}}
.title-foot{position:absolute;left:0;right:0;bottom:calc(14px*var(--u));text-align:center;font-size:var(--fs-xs);color:var(--mute)}
.corner-tr{position:absolute;top:calc(16px*var(--u));right:max(16px,calc(24px*var(--u)));display:flex;gap:10px}

/* ---------- hangar hub ---------- */
#scr-hub{padding:0}
.hub-left{position:absolute;top:calc(18px*var(--u));left:max(16px,calc(26px*var(--u)));width:min(40%,max(250px,calc(330px*var(--u))));display:flex;flex-direction:column;gap:calc(10px*var(--u))}
.hub-left .panel{padding:calc(14px*var(--u)) calc(16px*var(--u));display:flex;flex-direction:column;gap:calc(8px*var(--u))}
.hub-side{position:absolute;top:calc(18px*var(--u));right:max(16px,calc(26px*var(--u)));display:grid;grid-template-columns:repeat(2,auto);gap:calc(10px*var(--u))}
.hub-plane{display:flex;flex-direction:column;align-items:center;gap:calc(6px*var(--u));text-align:center}
.hub-plane .pname{font-family:var(--f-display);font-size:var(--fs-l);color:var(--paper);display:flex;align-items:center;gap:.4em}
.hub-start{position:absolute;left:50%;bottom:calc(34px*var(--u));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:calc(8px*var(--u))}
.lure{padding:calc(12px*var(--u)) calc(14px*var(--u));display:flex;flex-direction:column;gap:calc(8px*var(--u))}
.lure-row{display:grid;grid-template-columns:4.2em 1fr;align-items:center;gap:calc(8px*var(--u));font-size:var(--fs-s)}
.lure-row b{font-family:var(--f-display);font-weight:400;font-size:var(--fs-m);color:var(--paper)}
.lure-bar{display:flex;align-items:center;gap:.6em}
.lure-bar span{display:flex;gap:3px}
.lure-bar i{width:max(10px,calc(14px*var(--u)));height:max(10px,calc(14px*var(--u)));border-radius:3px;background:rgba(255,255,255,.14)}
.lure-bar i.on{background:linear-gradient(180deg,#fff0b0,#ffc94a)}
.route-icons{display:flex;align-items:center;gap:.4em}
.picon{display:inline-grid;place-items:center;width:max(30px,calc(40px*var(--u)));height:max(30px,calc(40px*var(--u)));border-radius:50%;border:3px solid currentColor;background:rgba(20,16,54,.8);box-shadow:0 0 12px currentColor}
.picon svg{width:58%;height:58%;fill:currentColor}

/* ---------- plane cards / collection ---------- */
.planes-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:calc(16px*var(--u));flex:1;min-height:0}
.plane-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(10px*var(--u));align-content:start;overflow:auto;padding:3px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:calc(10px*var(--u));border-radius:calc(18px*var(--u));background:linear-gradient(180deg,rgba(46,38,112,.9),rgba(26,21,70,.92));border:2px solid var(--edge);transition:transform .15s,border-color .2s,box-shadow .2s}
.pcard:hover{transform:translateY(-2px)}
.pcard.sel{border-color:var(--lamp);box-shadow:0 0 0 2px rgba(255,201,74,.35),0 0 24px rgba(255,201,74,.35)}
.pcard.locked canvas{filter:brightness(.25) saturate(0)}
.pcard canvas{width:100%;max-width:max(80px,calc(120px*var(--u)));aspect-ratio:1}
.pcard .pn{font-family:var(--f-display);font-size:var(--fs-m);color:var(--paper)}
.pcard .tagline{font-size:var(--fs-xs);color:var(--dim)}
.pcard .using{position:absolute;top:6px;left:6px}
.bar-mini{width:100%;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar-mini i{display:block;height:100%;background:linear-gradient(90deg,#c9a8ff,#ffe38a)}
.pdetail{padding:calc(14px*var(--u));display:flex;flex-direction:column;gap:calc(8px*var(--u));overflow:auto}
.pdetail h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:var(--fs-xl);color:var(--paper);display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.pdetail p{margin:0;font-size:var(--fs-s);line-height:1.6}
.pdetail .sec{font-size:var(--fs-s);line-height:1.6;padding:.5em .7em;border-radius:12px;background:rgba(15,12,42,.5)}
.pdetail .sec b{color:var(--lamp2);font-weight:700}
.starlist{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-xs);color:var(--dim)}
.starlist .ok{color:#b8f5cf}

/* ---------- gacha ---------- */
.gacha-wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:calc(16px*var(--u));flex:1;min-height:0;align-items:start}
.banner-card{position:relative;overflow:hidden;padding:calc(16px*var(--u));min-height:max(250px,calc(420px*var(--u)));display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:radial-gradient(circle at 70% 40%,rgba(255,215,106,.35),rgba(40,30,100,.9) 60%)}
.banner-card canvas{position:absolute;right:0;top:0;height:74%;width:auto;aspect-ratio:1;max-width:60%}
.banner-card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:var(--fs-xl);color:#fff3c8;position:relative}
.banner-card p{margin:0;font-size:var(--fs-s);color:var(--dim);position:relative;max-width:34em}
.gacha-side{display:flex;flex-direction:column;gap:calc(10px*var(--u))}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:var(--fs-xs);text-align:center}
.rates div{padding:.4em;border-radius:10px;background:rgba(15,12,42,.5)}
#scr-reveal{align-items:center;justify-content:center;gap:calc(12px*var(--u))}
.reveal-card{position:relative;width:min(92vw,calc(460px*var(--u)));padding:calc(18px*var(--u));border-radius:calc(26px*var(--u));text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;animation:revealIn .7s cubic-bezier(.2,.9,.3,1.3) both;border:3px solid var(--rc,#dfe6ff);background:radial-gradient(circle at 50% 30%,var(--rg,rgba(223,230,255,.3)),rgba(26,21,70,.96) 70%);box-shadow:0 0 60px var(--rg,rgba(223,230,255,.3))}
.reveal-card canvas{width:min(70vw,calc(260px*var(--u)));aspect-ratio:1}
.reveal-card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:max(30px,calc(48px*var(--u)));color:var(--paper)}
.reveal-card .burst-name{font-family:var(--f-display);color:var(--lamp2);font-size:var(--fs-m)}
.newbadge{position:absolute;top:14px;right:14px;font-family:var(--f-display);font-size:var(--fs-l);color:#fff3c8;background:var(--coral);padding:.1em .6em;border-radius:999px;transform:rotate(8deg)}
@keyframes revealIn{0%{opacity:0;transform:scale(.4) rotate(-8deg)}60%{opacity:1;transform:scale(1.06) rotate(2deg)}100%{transform:none}}
.reveal-sum{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,calc(720px*var(--u)))}
.reveal-sum .mini{display:flex;flex-direction:column;align-items:center;padding:6px;border-radius:12px;background:rgba(15,12,42,.6);border:2px solid var(--rc,#dfe6ff);width:max(64px,calc(86px*var(--u)));font-size:var(--fs-xs)}
.reveal-sum canvas{width:100%;aspect-ratio:1}

/* ---------- star map ---------- */
.smap-wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:calc(16px*var(--u));flex:1;min-height:0}
.smap{display:flex;flex-direction:column;justify-content:center;gap:calc(16px*var(--u));padding:calc(16px*var(--u)) calc(18px*var(--u));min-height:0}
.srow{display:grid;grid-template-columns:max(72px,calc(104px*var(--u))) minmax(0,1fr);align-items:center;gap:calc(12px*var(--u))}
.route-label{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-family:var(--f-display);font-size:var(--fs-m);color:var(--rc);white-space:nowrap}
.route-label svg{width:1.3em;height:1.3em;fill:currentColor}
.route-label em{font-style:normal;font-family:var(--f-body);font-size:var(--fs-xs);color:var(--lamp2)}
.strack{position:relative;display:flex;justify-content:space-between;align-items:center;padding-bottom:1.5em}
.strack::before,.strack-lit{content:"";position:absolute;left:calc(max(38px,calc(54px*var(--u)))/2);top:calc((100% - 1.5em)/2);height:3px;transform:translateY(-50%)}
.strack::before{right:calc(max(38px,calc(54px*var(--u)))/2);background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px)}
.strack-lit{max-width:calc(100% - max(38px,calc(54px*var(--u))));background:var(--rc);box-shadow:0 0 10px var(--rc)}
.snode{position:relative;flex:none;width:max(38px,calc(54px*var(--u)));height:max(38px,calc(54px*var(--u)));border-radius:50%;display:grid;place-items:center;border:2.5px solid rgba(255,255,255,.2);background:rgba(20,16,54,.92);color:var(--mute);transition:transform .15s,box-shadow .2s;padding:0}
.snode svg{width:55%;height:55%;fill:currentColor}
.snode small{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:var(--fs-xs);white-space:nowrap;color:var(--dim)}

/* ---------- tasks / cosmetics / codex / settings / records ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(220px,calc(290px*var(--u))),1fr));gap:calc(12px*var(--u));align-content:start}

input[type=range]{accent-color:var(--lamp);width:min(160px,40vw)}
.bind{min-width:4.5em;padding:.25em .6em;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid var(--edge);font-family:var(--f-num);font-weight:800;font-size:var(--fs-xs)}
.bind.wait{border-color:var(--lamp);color:var(--lamp2);animation:breathe 1s infinite}
table.metrics{border-collapse:collapse;width:100%;font-size:var(--fs-xs)}

.ok{color:#9ff2c8}.bad{color:#ffb2a8}

/* ---------- end screen ---------- */

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
#hud .hb{pointer-events:auto}
/* 战斗界面按需出现（lessons UT15，设计文档 §11.1）：.fly 的块平时在屏幕外，.in 时飞进来（带一点回弹），#hud.all（暂停）时全部进来 */
#hud .fly{transition:transform .5s cubic-bezier(.2,.9,.3,1.18),opacity .3s ease}
#hud:not(.all) .fly.fl:not(.in){transform:translateX(calc(-100% - 90px));opacity:0}
#hud:not(.all) .fly.fr:not(.in){transform:translateX(calc(100% + 90px));opacity:0}
#hud:not(.all) .fly.ft:not(.in){transform:translate(-50%,calc(-100% - 70px));opacity:0}
#hud:not(.all) .fly.fb:not(.in){transform:translate(-50%,calc(100% + 70px));opacity:0}
#hud.all{z-index:4}
#hud.all .hb,#hud.all .hint-box,#hud.all .streak{visibility:hidden}
/* 开局移动教学：按设备的小动画 */

.tm-keys .kw{grid-column:2;grid-row:1}.tm-keys .ka{grid-column:1;grid-row:2;animation-delay:.6s}.tm-keys .ks{grid-column:2;grid-row:2;animation-delay:1.2s}.tm-keys .kd{grid-column:3;grid-row:2;animation-delay:1.8s}
@keyframes kcPress{0%,22%,100%{transform:none;background:#2d2358;box-shadow:0 3px 0 #15102e}8%{transform:translateY(3px);background:var(--lamp);color:#2d2358;box-shadow:0 0 0 #15102e}}

.tm-drag.touch .ptr{clip-path:none;border-radius:50%;background:rgba(255,255,255,.75);width:20%;height:30%}
@keyframes tmDrag{0%,12%{transform:none}55%,70%{transform:translate(170%,-55%)}100%{transform:none}}
.tm-pad .stick{position:absolute;left:28%;top:6%;width:44%;height:88%;border-radius:50%;background:#2d2358;border:2px solid rgba(255,255,255,.35)}

@keyframes tmStick{0%,100%{transform:none}20%{transform:translate(45%,0)}45%{transform:translate(0,-45%)}70%{transform:translate(-45%,0)}}
.hud-tl{position:absolute;top:calc(10px*var(--u));left:max(16px,calc(20px*var(--u)));display:flex;flex-direction:column;align-items:flex-start;gap:calc(6px*var(--u))}
.hearts svg{flex:none}

.slot{position:relative;width:max(40px,calc(52px*var(--u)));height:max(40px,calc(52px*var(--u)));border-radius:calc(14px*var(--u));background:rgba(20,16,54,.72);border:2px dashed rgba(255,255,255,.18);display:grid;place-items:center}

.mp-giftpick{width:100%;margin-top:8px}.mp-giftpick .cl-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.mp-giftpick .cl-it{font-size:var(--fs-xs);padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.07);font-weight:600;border:0;cursor:pointer}.mp-giftpick .cl-it:hover,.mp-giftpick .cl-it:focus-visible{background:rgba(255,255,255,.16)}

/* 联机 */
.mp-wrap{display:grid;grid-template-columns:minmax(max(240px,calc(300px*var(--u))),1fr) 2fr;gap:calc(14px*var(--u));align-items:start}
.mp-me .row canvas{width:max(48px,calc(64px*var(--u)));height:auto}
.mp-nick{display:flex;flex-direction:column;gap:4px}
.mp-nick input{font:inherit;font-size:var(--fs-m);color:var(--paper);background:rgba(10,8,30,.55);border:1.5px solid var(--edge);border-radius:12px;padding:.35em .7em;width:100%;box-sizing:border-box}
.mp-nick input:focus{outline:2px solid var(--lamp);outline-offset:1px}
.mp-net{font-size:var(--fs-xs);margin:0}
.mp-world{font-size:var(--fs-xs);margin:0;color:#9ff2c8}
.hgoal{font-size:var(--fs-xs);color:#ffe38a;background:rgba(15,12,42,.6);border:1px solid rgba(255,215,106,.45);border-radius:999px;padding:.15em .8em;width:max-content}
.mp-link{font:inherit;font-size:var(--fs-xs);color:var(--paper);background:rgba(10,8,30,.55);border:1px solid var(--edge);border-radius:10px;padding:.3em .6em;flex:1;min-width:12em}
.mp-list{display:flex;flex-direction:column;gap:8px}
.mp-room{display:flex;align-items:center;gap:12px;padding:.45em .8em;border-radius:12px;background:rgba(10,8,30,.4);border:1px solid var(--edge)}
.mp-room span{flex:1;min-width:0}
.mp-code{font-family:var(--f-display);font-weight:400;letter-spacing:.12em;color:var(--lamp2)}
.mp-members{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(160px,calc(200px*var(--u))),1fr));gap:8px}
.mp-mem{display:flex;align-items:center;gap:8px;padding:.35em .6em;border-radius:12px;background:rgba(10,8,30,.4);border:1px solid var(--edge)}
.mp-mem.me{border-color:rgba(255,201,74,.6)}
.mp-mem > i{width:10px;height:10px;border-radius:50%;flex:none}
.mp-mem canvas{width:max(40px,calc(52px*var(--u)));height:auto;flex:none}
.mp-grow{color:#ffd9a8;font-size:var(--fs-xs)}
.chip.ok{color:#9ff2c8;border-color:#9ff2c8}
.mp-cd{color:#ffe38a;font-size:var(--fs-l)}
.mp-rules{font-size:var(--fs-xs);color:var(--paper);background:rgba(10,8,30,.35);border:1px solid var(--edge);border-radius:12px;padding:.4em .8em}
.mp-rules summary{cursor:pointer;font-weight:700;color:#ffe38a}
.mp-rules ul{margin:.3em 0 .2em;padding-left:1.2em;display:flex;flex-direction:column;gap:.2em}
#mp-rules-card{position:absolute;left:50%;transform:translateX(-50%);max-width:min(560px,70%);pointer-events:none;z-index:6;opacity:.82}
#mp-rules-card.at-bottom{bottom:10px}
#mp-rules-card.at-top{top:78px}
#mp-rules-card .mp-rules{background:rgba(12,9,34,.72);font-size:calc(var(--fs-xs) * .92)}
.vs-board{display:flex;flex-direction:column;gap:6px;min-width:min(520px,90vw);padding:.6em .8em}
.vs-row{display:grid;grid-template-columns:2em 12px 1fr auto;align-items:center;gap:4px 10px;padding:.35em .6em;border-radius:10px;background:rgba(10,8,30,.4);border:1px solid var(--edge)}
.vs-row.me{border-color:rgba(255,201,74,.7)}
.vs-row > i{width:10px;height:10px;border-radius:50%}
.vs-row .num{font-size:var(--fs-l);color:var(--lamp2);font-variant-numeric:tabular-nums}
.vs-row small{grid-column:3 / -1}
.vs-gap{margin:.4em 0 0;font-size:var(--fs-s);color:var(--paper)}
.vs-gap b{color:#ffe38a}
.team{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-xs)}
.team div{display:flex;align-items:center;gap:6px;padding:1px 8px 1px 4px;border-radius:999px;background:rgba(15,12,42,.55);width:max-content}
.team div > i{width:9px;height:9px;border-radius:50%;flex:none}
.team div b{font-weight:600;color:var(--paper)}
.team div.down{color:#ffb2a8}
.team div.gone{opacity:.45}
.team .hp{letter-spacing:-1px;color:#ff8fa8}
#mpwait{position:absolute;left:50%;bottom:calc(120px*var(--u));transform:translateX(-50%);padding:.4em 1.2em;border-radius:999px;background:rgba(15,12,42,.85);border:1.5px solid rgba(159,227,240,.6);color:var(--paper);font-size:var(--fs-s);pointer-events:none;z-index:6}
@media (max-width:760px){.mp-wrap{grid-template-columns:1fr}}

/* ---------- 站（stationui.js） ---------- */
.st-top{display:flex;align-items:center;gap:calc(10px*var(--u));flex-wrap:wrap;position:relative;z-index:2}
.st-top .icon-btn{min-width:max(52px,calc(68px*var(--u)));min-height:max(52px,calc(68px*var(--u)))}
.pilot-badge{display:flex;flex-direction:column;gap:4px;min-width:calc(150px*var(--u));padding:.35em .9em;border-radius:14px;background:rgba(20,16,44,.78);border:1.5px solid rgba(255,210,122,.45)}
.pilot-badge b{font-family:var(--f-display);font-weight:400;font-size:var(--fs-m);color:#ffe7b0}
.pilot-badge.big{min-width:0;width:100%}
.curname{color:var(--dim);font-size:var(--fs-xs)}
.st-hot{--hc:#ffcf8a;font-size:var(--fs-s);padding:.3em .9em}
.st-hot.locked{--hc:#6a6288;color:var(--mute);background:rgba(16,12,36,.7)}
.st-hot .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 8px var(--coral)}
.st-launch{position:absolute;right:max(16px,calc(28px*var(--u)));bottom:calc(18px*var(--u));width:min(calc(420px*var(--u)),calc(100% - 32px));padding:calc(12px*var(--u)) calc(16px*var(--u));display:flex;flex-direction:column;gap:8px;z-index:2}
.st-crate{display:flex;flex-direction:column;gap:6px;padding-bottom:8px;border-bottom:1px dashed rgba(255,214,140,.35)}
.crate-row{display:flex;flex-wrap:wrap;gap:6px}
.crate-opt{cursor:pointer;font:inherit}.crate-opt b{margin-left:2px;font-weight:600}
.crate-opt.rec{box-shadow:0 0 0 2px var(--qc),0 0 14px var(--qc)}
.crate-opt:hover,.crate-opt:focus-visible{background:rgba(40,30,70,.9)}
.st-launch .mission{font-family:var(--f-display);font-size:var(--fs-m);color:#ffe7b0}
.st-launch .row .btn.big{flex:1 1 0;min-width:0;padding:0 calc(14px*var(--u));white-space:nowrap}
.stage-node{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;padding:.35em .8em;border-radius:12px;background:rgba(255,255,255,.05);border:1.5px solid var(--edge);font-size:var(--fs-xs);color:var(--dim)}
.stage-node b{font-family:var(--f-num);font-weight:800;color:var(--paper)}
.stage-node.sel{border-color:var(--lamp);box-shadow:0 0 12px rgba(255,201,74,.35);color:var(--paper)}
.stage-node.cleared i{font-style:normal;color:#9ff2c8}
.stage-node.locked{opacity:.45}
.st-panel{position:absolute;left:max(16px,calc(24px*var(--u)));right:max(16px,calc(24px*var(--u)));top:calc(86px*var(--u));bottom:calc(16px*var(--u));overflow:auto;padding:calc(14px*var(--u)) calc(18px*var(--u));display:flex;flex-direction:column;gap:10px;z-index:4;background:linear-gradient(180deg,rgba(26,20,52,.97),rgba(14,11,32,.97))}
.equip{display:grid;grid-template-columns:minmax(260px,.95fr) minmax(0,1.15fr) minmax(300px,1fr);grid-template-areas:"ship stash detail" "stats stash detail";gap:calc(12px*var(--u));align-items:start}
.eq-ship{grid-area:ship;position:relative;height:calc(300px*var(--u));min-height:240px;border-radius:16px;background:radial-gradient(70% 60% at 50% 50%,rgba(90,70,150,.35),rgba(10,8,24,.2));border:1px solid var(--edge)}
.eq-plane{position:absolute;left:50%;top:52%;width:46%;height:auto;transform:translate(-50%,-50%)}
.eq-slot{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;transform:translate(-50%,-50%);font-size:var(--fs-xs);color:var(--dim)}
.eq-slot canvas{width:max(44px,calc(56px*var(--u)));height:max(44px,calc(56px*var(--u)))}
.eq-slot.on canvas{filter:drop-shadow(0 0 6px rgba(255,210,122,.8))}
.eq-slot.s-gun{left:88%;top:44%}.eq-slot.s-aux{left:62%;top:84%}.eq-slot.s-core{left:50%;top:16%}.eq-slot.s-armor{left:38%;top:84%}
.eq-slot.s-engine{left:11%;top:46%}.eq-slot.s-radar{left:74%;top:16%}.eq-slot.s-chip1{left:24%;top:16%}.eq-slot.s-chip2{left:86%;top:84%}
.eq-stats{grid-area:stats;display:grid;grid-template-columns:1fr 1fr;column-gap:10px;row-gap:2px;font-size:var(--fs-xs)} /* 两列：一屏放得下全部属性（评审：最后一行被面板底边切掉） */
.eq-stats .sr{display:flex;justify-content:space-between;gap:10px;padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.05)}
.eq-stats .sr span{color:var(--dim)}
.eq-stash{grid-area:stash;display:flex;flex-direction:column;gap:8px;min-width:0}
.gcells{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(48px,calc(58px*var(--u))),1fr));gap:6px}
.gcells.small{grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}
.gcell{position:relative;border-radius:10px;padding:2px;aspect-ratio:1/1}
.gcell canvas{width:100%;height:100%}
.gcell.sel{outline:2px solid var(--lamp);border-radius:12px}
.gcell.junk{opacity:.45}
.gcell.req canvas{filter:grayscale(.6) brightness(.8)}
.gcell .better{position:absolute;right:2px;top:0;font-style:normal;color:#6fe39a;font-size:12px;text-shadow:0 0 4px #000}
.gcell .lk{position:absolute;left:3px;bottom:1px;font-style:normal;font-size:10px;color:#ffd27a}
.eq-detail{grid-area:detail;display:flex;flex-direction:column;gap:8px}
.eq-hint{padding:1em}
.tips{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.gtip{flex:1 1 200px;min-width:200px;padding:.6em .8em;border-radius:12px;background:rgba(8,6,18,.92);border:1.5px solid var(--qc);box-shadow:0 0 18px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:2px;font-size:var(--fs-s)}
.gt-head{font-size:var(--fs-xs);color:var(--mute)}
.gt-name{font-family:var(--f-display);font-size:var(--fs-m)}
.gt-line.small{font-size:var(--fs-xs)}
.gt-tier{margin-left:.5em;color:var(--mute);font-size:.8em}
.gt-set{margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,.08);font-size:var(--fs-xs);color:#6a8f6a}
.gt-set .on,.gt-pieces .on{color:#3ee05a}
.gt-req{font-size:var(--fs-xs);color:var(--dim)}.gt-req.bad{color:#ff7a6b}
.cmp{padding:.5em .8em;border-radius:12px;background:rgba(255,255,255,.04);font-size:var(--fs-s)}
.cmp-sum{font-family:var(--f-display);font-size:var(--fs-m)}
.cmp-line.up{color:#6fe39a}.cmp-line.down{color:#ff7a6b}
.st-foot{padding-top:6px;border-top:1px solid rgba(255,255,255,.06)}
.tog{display:inline-flex;align-items:center;gap:.4em;font-size:var(--fs-s);color:var(--dim)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(300px*var(--u)),1fr));gap:8px}
.shop-item{display:flex;align-items:center;gap:10px;padding:.4em .6em;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--edge)}
.shop-item.sel{border-color:var(--lamp)}
.shop-item canvas{width:max(44px,calc(56px*var(--u)));height:max(44px,calc(56px*var(--u)));flex:none}
.si-body{display:flex;flex-direction:column;flex:1;min-width:0}
.reveal{animation:revealIn .5s both}
.cx-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(320px*var(--u)),1fr));gap:8px}
.cx-set{display:flex;flex-direction:column;gap:4px;padding:.5em .7em;border-radius:12px;background:rgba(255,255,255,.04)}
.cx-unis{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(220px*var(--u)),1fr));gap:6px}
.cx-uni{display:flex;flex-direction:column;gap:2px;padding:.4em .6em;border-radius:10px;background:rgba(255,255,255,.03);font-size:var(--fs-xs)}
.cx-uni.got{border:1px solid rgba(217,164,67,.5)}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(300px*var(--u)),1fr));gap:10px}
.map-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:.7em .9em;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--mc);font-size:var(--fs-s)}
.map-card b{font-family:var(--f-display);font-weight:400;font-size:var(--fs-m);color:var(--mc)}
.map-card small{color:var(--dim)}
.map-card.sel{box-shadow:0 0 18px var(--mc)}
.map-card.locked{opacity:.45;border-style:dashed}
.loot-list{display:flex;flex-wrap:wrap;gap:6px}
.loot-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 2px;border-radius:10px;background:rgba(8,6,18,.7);border:1px solid var(--qc);color:var(--qc);font-size:var(--fs-s)}
.loot-chip canvas{width:32px;height:32px}
.loot-chip.lost{opacity:.4;filter:grayscale(.8);text-decoration:line-through}
.loot-lost{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.end-loot{grid-column:span 1}
@media (max-width:980px){.equip{grid-template-columns:1fr 1fr;grid-template-areas:"ship detail" "stats detail" "stash stash"}}
</style>
