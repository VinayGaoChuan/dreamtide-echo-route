<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>梦潮回声航线</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+SC:wght@500;700;900&family=ZCOOL+KuaiLe&display=swap">
<style>
:root{
  color-scheme:dark;
  --deep:#0f0c2a; --night:#16123b; --night2:#221b56; --ink:#2d2358;
  --paper:#fff6ee; --lamp:#ffc94a; --lamp2:#ffe596; --coral:#ff7a6b; --cyan:#5fd4ff;
  --dust:#b58cff; --info:#a9c8ff; --pink:#ff7eb6; --white:#f7f4ff;
  --text:#f4efff; --dim:#bcb3e6; --mute:#8b83bb;
  --panel:rgba(35,28,90,.88); --panel2:rgba(21,17,58,.92); --edge:rgba(182,200,255,.24);
  --f-display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
  --u:1; --tb:1;
  --fs-xs:max(11px,calc(13px*var(--u)));
  --fs-s:max(12px,calc(15px*var(--u)));
  --fs-m:max(13px,calc(18px*var(--u)));
  --fs-l:max(16px,calc(25px*var(--u)));
  --fs-xl:max(22px,calc(40px*var(--u)));
  --sp:calc(16px*var(--u));
  --r:calc(20px*var(--u));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--deep);overflow:hidden}
body{color:var(--text);font-family:var(--f-body);font-weight:500;-webkit-font-smoothing:antialiased;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 40%,#231c5c 0%,#140f36 60%,#0c0a24 100%)}
#cv{position:absolute;display:block;image-rendering:auto}
#stage{position:absolute;overflow:hidden;pointer-events:none}
#stage > *{pointer-events:auto}
#screens{position:absolute;inset:0;pointer-events:none;z-index:3}
#screens > .screen{pointer-events:auto}
#hud{z-index:2}
#touch{z-index:1}
#banner{z-index:4}
#toast{z-index:5}
.flip{transform:scaleX(-1)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
:focus{outline:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:14px}
svg.ic{width:1.1em;height:1.1em;fill:currentColor;flex:none;vertical-align:-.16em}

/* ---------- generic building blocks ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:auto;
  padding-block:calc(22px*var(--u));padding-inline:max(16px,calc(34px*var(--u)));
  animation:scrIn .28s ease-out both}
.screen.dim{background:radial-gradient(90% 80% at 50% 45%,rgba(20,15,56,.55),rgba(10,8,30,.86))}
.screen.dim-soft{background:linear-gradient(180deg,rgba(12,9,34,.35),rgba(12,9,34,.62))}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{position:relative;background:linear-gradient(180deg,rgba(44,36,108,.9),rgba(24,19,64,.92));
  border:2px solid var(--edge);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 calc(14px*var(--u)) calc(40px*var(--u)) rgba(6,4,24,.55),0 0 calc(26px*var(--u)) rgba(120,140,255,.12)}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.5;
  background-image:var(--paper-tex,none);background-size:calc(256px*var(--u));mix-blend-mode:soft-light}
.h-display{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-weight:800;font-variant-numeric:tabular-nums}
.dim-text{color:var(--dim)}
.row{display:flex;align-items:center;gap:calc(10px*var(--u))}
.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:max(40px,calc(52px*var(--u)));
  padding:0 max(14px,calc(24px*var(--u)));border-radius:999px;font-family:var(--f-display);font-size:var(--fs-m);
  color:var(--text);background:rgba(255,255,255,.07);border:2px solid rgba(190,205,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:transform .12s,box-shadow .2s,background .2s}
.btn:hover{background:rgba(255,255,255,.13);box-shadow:0 0 18px rgba(150,170,255,.25)}
.btn:active{transform:scale(.96)}
.btn.primary{color:#3b2152;border-color:#fff3c6;
  background:linear-gradient(180deg,#fff0b0 0%,#ffcf55 52%,#f3a43b 100%);
  box-shadow:0 0 calc(26px*var(--u)) rgba(255,201,74,.5),inset 0 -4px 0 rgba(170,90,20,.35),inset 0 3px 0 rgba(255,255,255,.65)}
.btn.primary:hover{box-shadow:0 0 calc(40px*var(--u)) rgba(255,201,74,.75),inset 0 -4px 0 rgba(170,90,20,.35),inset 0 3px 0 rgba(255,255,255,.65)}
.btn.big{min-height:max(52px,calc(72px*var(--u)));font-size:var(--fs-l);padding:0 max(26px,calc(48px*var(--u)))}
.btn.cyan{border-color:rgba(95,212,255,.6);box-shadow:0 0 16px rgba(95,212,255,.25)}
.btn.coral{border-color:rgba(255,122,107,.6)}
.btn[disabled]{opacity:.45;filter:saturate(.5)}
.icon-btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  width:max(56px,calc(78px*var(--u)));min-height:max(56px,calc(78px*var(--u)));border-radius:calc(22px*var(--u));
  background:rgba(30,24,80,.72);border:2px solid var(--edge);font-size:var(--fs-xs);color:var(--dim);
  transition:transform .12s,border-color .2s,color .2s}
.icon-btn svg{width:max(22px,calc(30px*var(--u)));height:max(22px,calc(30px*var(--u)));fill:var(--info)}
.icon-btn:hover{border-color:rgba(255,201,74,.6);color:var(--text)}
.icon-btn:hover svg{fill:var(--lamp)}
.icon-btn:active{transform:scale(.94)}
.chip{display:inline-flex;align-items:center;gap:.35em;padding:.18em .7em;border-radius:999px;font-size:var(--fs-xs);
  background:rgba(169,200,255,.12);border:1px solid rgba(169,200,255,.3);color:var(--info);white-space:nowrap}
.chip.gold{background:rgba(255,201,74,.14);border-color:rgba(255,201,74,.45);color:var(--lamp2)}
.chip.coral{background:rgba(255,122,107,.14);border-color:rgba(255,122,107,.45);color:#ffb2a8}
.chip.cyan{background:rgba(95,212,255,.13);border-color:rgba(95,212,255,.45);color:#aeeaff}
.chip.dust{background:rgba(181,140,255,.15);border-color:rgba(181,140,255,.45);color:#dcc8ff}
.chip.white{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:#fff}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.6em;padding:0 .35em;
  border-radius:.4em;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
  border-bottom-width:3px;font-family:var(--f-num);font-weight:800;font-size:.85em;color:var(--text)}
.label{font-size:var(--fs-xs);letter-spacing:.12em;color:var(--mute)}
.back-btn{position:absolute;top:calc(18px*var(--u));left:max(16px,calc(28px*var(--u)));z-index:3}
.screen-title{display:flex;align-items:baseline;flex-wrap:wrap;gap:calc(6px*var(--u)) calc(14px*var(--u));margin:0 0 calc(10px*var(--u));padding-left:max(104px,calc(120px*var(--u)))}
.screen-title h2{font-family:var(--f-display);font-weight:400;font-size:var(--fs-xl);margin:0;color:var(--paper);
  text-shadow:0 0 18px rgba(255,201,74,.35)}
.screen-title p{margin:0;color:var(--dim);font-size:var(--fs-s)}

/* ---------- title ---------- */
#scr-title{cursor:pointer;justify-content:center;align-items:flex-end;text-align:center;padding-inline:max(16px,calc(90px*var(--u)))}
.title-block{display:flex;flex-direction:column;align-items:center;gap:calc(10px*var(--u));max-width:min(92%,calc(640px*var(--u)))}
.title-main{font-family:var(--f-display);font-size:max(56px,calc(150px*var(--u)));line-height:.95;color:var(--paper);margin:0;
  text-shadow:0 0 calc(30px*var(--u)) rgba(255,201,74,.55),0 calc(6px*var(--u)) 0 #3a2c72}
.title-main em{font-style:normal;color:var(--lamp2)}
.title-sub{font-family:var(--f-display);font-size:max(20px,calc(44px*var(--u)));color:#d9ccff;letter-spacing:.3em;margin:0 0 0 .3em;
  text-shadow:0 0 16px rgba(181,140,255,.6)}
.title-tag{font-size:var(--fs-m);color:var(--paper);background:rgba(30,24,80,.55);border:1px solid var(--edge);
  padding:.45em 1.1em;border-radius:999px;margin-top:calc(12px*var(--u))}
.title-start{margin-top:calc(22px*var(--u));font-family:var(--f-display);font-size:var(--fs-l);color:var(--lamp2);animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.98)}50%{opacity:1;transform:scale(1.03)}}
.title-foot{position:absolute;left:0;right:0;bottom:calc(14px*var(--u));text-align:center;font-size:var(--fs-xs);color:var(--mute)}
.corner-tr{position:absolute;top:calc(16px*var(--u));right:max(16px,calc(24px*var(--u)));display:flex;gap:10px}

/* ---------- hub ---------- */
#scr-hub{padding:0}
.hub-info{position:absolute;top:calc(22px*var(--u));left:max(16px,calc(30px*var(--u)));width:min(46%,calc(340px*var(--u)));
  padding:calc(16px*var(--u)) calc(18px*var(--u));display:flex;flex-direction:column;gap:calc(10px*var(--u))}
.hub-dust{display:flex;align-items:center;gap:.5em;font-size:var(--fs-l);color:#e3d2ff}
.hub-dust svg{width:1.2em;height:1.2em;fill:var(--dust);filter:drop-shadow(0 0 6px rgba(181,140,255,.8))}
.region-list{display:flex;flex-direction:column;gap:calc(5px*var(--u));font-size:var(--fs-xs)}
.region{display:flex;align-items:center;gap:.5em;color:var(--mute)}
.region.on{color:var(--text)}
.region i{width:.7em;height:.7em;border-radius:50%;background:rgba(255,255,255,.18);flex:none}
.region.on i{background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
.hub-side{position:absolute;top:calc(22px*var(--u));right:max(16px,calc(28px*var(--u)));display:grid;grid-template-columns:repeat(2,auto);gap:calc(10px*var(--u))}
.hub-loadout{display:flex;gap:calc(10px*var(--u));flex-wrap:wrap;justify-content:center;max-width:min(90vw,calc(560px*var(--u)))}
.equip{display:flex;align-items:center;gap:.5em;padding:.4em .9em;border-radius:999px;background:rgba(24,19,64,.8);border:1.5px solid var(--edge);font-size:var(--fs-s)}
.equip svg{width:1.35em;height:1.35em}
.hub-start{position:absolute;left:50%;bottom:calc(40px*var(--u));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:calc(10px*var(--u))}
.hub-cont{position:absolute;right:max(16px,calc(30px*var(--u)));bottom:calc(40px*var(--u));display:flex;flex-direction:column;gap:8px;align-items:flex-end}

/* ---------- loadout ---------- */
.steps{display:flex;gap:calc(8px*var(--u));align-items:center;font-size:var(--fs-s);color:var(--mute);flex-wrap:wrap}
.step{display:flex;align-items:center;gap:.45em}
.step b{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;border:1.5px solid var(--mute);font-family:var(--f-num)}
.step.on{color:var(--text)}.step.on b{border-color:var(--lamp);background:var(--lamp);color:#3b2152}
.step.done b{border-color:var(--cyan);color:var(--cyan)}
.step-sep{width:calc(26px*var(--u));height:2px;background:rgba(255,255,255,.18)}
.lo-body{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:calc(18px*var(--u));flex:1;min-height:0;margin-top:calc(12px*var(--u))}
.cards-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(10px*var(--u));align-content:start;overflow:auto;min-height:0;padding:3px}
.wcard{position:relative;text-align:left;padding:calc(10px*var(--u)) calc(12px*var(--u));border-radius:calc(18px*var(--u));
  background:linear-gradient(180deg,rgba(46,38,112,.9),rgba(26,21,70,.92));border:2px solid var(--edge);display:flex;flex-direction:column;gap:calc(6px*var(--u));
  transition:transform .15s,border-color .2s,box-shadow .2s}
.wcard:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.45)}
.wcard.sel{border-color:var(--lamp);box-shadow:0 0 0 2px rgba(255,201,74,.35),0 0 26px rgba(255,201,74,.35)}
.wcard.locked{background:linear-gradient(180deg,rgba(38,32,86,.9),rgba(24,20,60,.92))}
.wcard .wtitle{display:flex;align-items:center;gap:.5em;font-family:var(--f-display);font-size:var(--fs-l);color:var(--paper)}
.wcard .wtitle svg{width:1.3em;height:1.3em}
.wcard .wtag{font-size:var(--fs-xs);color:var(--lamp2)}
.stat{display:grid;grid-template-columns:4.6em 1fr;align-items:center;gap:.5em;font-size:var(--fs-xs);color:var(--dim)}
.pips{display:flex;gap:3px}
.pips i{height:.55em;flex:1;border-radius:3px;background:rgba(255,255,255,.12)}
.pips i.on{background:linear-gradient(90deg,var(--cyan),#9ee9ff)}
.pips.gold i.on{background:linear-gradient(90deg,#ffb84a,var(--lamp2))}
.pips.coral i.on{background:linear-gradient(90deg,#ff8f7f,#ffc0b6)}
.lock-line{font-size:var(--fs-xs);color:#ffd9a0;display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.lo-side{display:flex;flex-direction:column;gap:calc(12px*var(--u));min-height:0;overflow:auto}
.demo-wrap{position:relative;border-radius:calc(18px*var(--u));overflow:hidden;border:2px solid var(--edge);aspect-ratio:16/9;max-width:100%;background:#1b1648}
.demo-wrap canvas{width:100%;height:100%;display:block}
.demo-cap{position:absolute;left:10px;top:8px;font-size:var(--fs-xs);color:var(--dim);background:rgba(15,12,42,.6);padding:.15em .6em;border-radius:999px}
.problem{padding:calc(12px*var(--u)) calc(14px*var(--u));font-size:var(--fs-s);line-height:1.6}
.problem b{color:var(--lamp2);font-weight:700}
.lo-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:calc(12px*var(--u));flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:calc(8px*var(--u))}
.legend-row{display:grid;grid-template-columns:max(40px,calc(54px*var(--u))) 1fr;gap:calc(12px*var(--u));align-items:center;
  padding:calc(8px*var(--u)) calc(12px*var(--u));border-radius:calc(14px*var(--u));background:rgba(24,19,64,.7);border:1px solid var(--edge)}
.legend-row canvas{width:max(40px,calc(54px*var(--u)));height:max(40px,calc(54px*var(--u)))}
.legend-row .ln{font-family:var(--f-display);font-size:var(--fs-m)}
.legend-row .lt{font-size:var(--fs-xs);color:var(--dim);line-height:1.5}

/* ---------- codex ---------- */
.tabs{display:flex;gap:calc(8px*var(--u));flex-wrap:wrap;margin-bottom:calc(12px*var(--u))}
.tab{padding:.4em 1em;border-radius:999px;font-size:var(--fs-s);border:1.5px solid var(--edge);color:var(--dim);background:rgba(24,19,64,.6)}
.tab.on{color:#3b2152;background:var(--lamp);border-color:var(--lamp2)}
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(220px,calc(300px*var(--u))),1fr));gap:calc(12px*var(--u))}
.cx{display:grid;grid-template-columns:max(64px,calc(92px*var(--u))) 1fr;gap:calc(12px*var(--u));padding:calc(12px*var(--u));align-items:start}
.cx canvas{width:max(64px,calc(92px*var(--u)));height:max(64px,calc(92px*var(--u)));border-radius:14px;background:rgba(12,10,36,.6)}
.cx h3{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:var(--fs-m);color:var(--paper)}
.cx p{margin:4px 0 0;font-size:var(--fs-xs);color:var(--dim);line-height:1.55}
.cx .row{gap:6px;flex-wrap:wrap}
.cx.unknown{opacity:.55}
.story{padding:calc(14px*var(--u)) calc(16px*var(--u));font-size:var(--fs-s);line-height:1.8}
.story h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400;color:var(--lamp2);font-size:var(--fs-m)}

/* ---------- route map ---------- */
#scr-map{padding:0}
.map-head{position:absolute;top:calc(16px*var(--u));left:max(16px,calc(30px*var(--u)));right:max(16px,calc(30px*var(--u)));display:flex;align-items:center;gap:calc(12px*var(--u));flex-wrap:wrap;z-index:2}
.map-head h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:var(--fs-l);color:var(--paper)}
.map-area{position:absolute;left:max(16px,calc(40px*var(--u)));right:calc(330px*var(--u));top:calc(84px*var(--u));bottom:calc(40px*var(--u))}
.map-area svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lane-label{position:absolute;left:0;font-size:var(--fs-xs);color:var(--dim);transform:translateY(-50%);white-space:nowrap;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:max(38px,calc(58px*var(--u)));height:max(38px,calc(58px*var(--u)));border-radius:50%;
  display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#3d3394,#211a5a);border:2.5px solid rgba(190,205,255,.35);
  box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .15s,box-shadow .2s}
.node svg{width:52%;height:52%;fill:var(--info)}
.node.t-elite svg{fill:#ff9d8c}.node.t-rest svg{fill:#9ff2c8}.node.t-shop svg{fill:var(--dust)}.node.t-challenge svg{fill:#ffb35c}.node.t-boss svg{fill:var(--lamp)}
.node.t-boss{width:max(50px,calc(78px*var(--u)));height:max(50px,calc(78px*var(--u)))}
.node.done{opacity:.45;filter:saturate(.4)}
.node.cur{border-color:var(--lamp);box-shadow:0 0 0 4px rgba(255,201,74,.25),0 0 24px rgba(255,201,74,.6)}
.node.avail{border-color:#fff;animation:nodePulse 1.6s ease-in-out infinite}
.node.avail:hover,.node.pick{transform:translate(-50%,-50%) scale(1.14)}
.node.pick{border-color:var(--lamp);box-shadow:0 0 0 5px rgba(255,201,74,.3),0 0 30px rgba(255,201,74,.7)}
.node.locked{opacity:.7;cursor:default}
@keyframes nodePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 8px rgba(255,255,255,0),0 4px 14px rgba(0,0,0,.35)}}
.map-panel{position:absolute;right:max(16px,calc(26px*var(--u)));top:calc(84px*var(--u));bottom:calc(40px*var(--u));width:calc(290px*var(--u));min-width:200px;
  padding:calc(16px*var(--u));display:flex;flex-direction:column;gap:calc(10px*var(--u));overflow:auto}
.map-panel h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:var(--fs-l);color:var(--paper)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:var(--fs-xs);color:var(--dim)}
.kv b{color:var(--text);font-weight:700}
.run-mini{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- results, cards ---------- */
.center-col{margin:auto;display:flex;flex-direction:column;align-items:center;gap:calc(14px*var(--u));width:100%;max-width:calc(1060px*var(--u))}
.grade{font-family:var(--f-display);font-size:max(48px,calc(96px*var(--u)));line-height:1;color:var(--lamp2);text-shadow:0 0 30px rgba(255,201,74,.6)}
.statrow{display:flex;gap:calc(10px*var(--u));flex-wrap:wrap;justify-content:center}
.stat-pill{display:flex;flex-direction:column;align-items:center;min-width:calc(84px*var(--u));padding:.5em .8em;border-radius:14px;background:rgba(24,19,64,.72);border:1px solid var(--edge)}
.stat-pill .num{font-size:var(--fs-l)}
.stat-pill span{font-size:var(--fs-xs);color:var(--dim)}
.card-row{display:flex;gap:calc(16px*var(--u));justify-content:center;flex-wrap:wrap;width:100%}
.dcard{position:relative;width:min(31%,calc(270px*var(--u)));min-width:170px;text-align:left;padding:calc(14px*var(--u));border-radius:calc(20px*var(--u));
  background:linear-gradient(170deg,#3a2f8c 0%,#231c5e 60%,#1b1650 100%);border:2px solid rgba(190,205,255,.35);
